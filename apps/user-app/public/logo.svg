<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 主渐变 - 蓝色科技感 -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#5856d6"/>
    </linearGradient>

    <!-- 发光效果渐变 -->
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#007aff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- S字母专用渐变 -->
    <linearGradient id="sGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#5856d6"/>
    </linearGradient>

    <!-- 内发光 -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- 外发光效果 -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feFlood flood-color="#007aff" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- 强发光 -->
    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#00d4ff" flood-opacity="0.8"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景六边形 - 科技底座 -->
  <polygon
    points="32,4 56,18 56,46 32,60 8,46 8,18"
    fill="none"
    stroke="url(#mainGradient)"
    stroke-width="1.5"
    opacity="0.4"
  />

  <!-- 内层六边形 -->
  <polygon
    points="32,10 50,21 50,43 32,54 14,43 14,21"
    fill="url(#mainGradient)"
    opacity="0.15"
  />

  <!-- N字母 - 左侧几何 -->
  <g filter="url(#outerGlow)">
    <!-- N 的左竖线 -->
    <rect x="12" y="22" width="4" height="20" rx="1" fill="url(#mainGradient)"/>
    <!-- N 的斜线 -->
    <polygon points="12,22 16,22 28,42 24,42" fill="url(#mainGradient)"/>
    <!-- N 的右竖线 -->
    <rect x="24" y="22" width="4" height="20" rx="1" fill="url(#mainGradient)"/>
  </g>

  <!-- S字母 - 重新设计，更饱满有质感 -->
  <g filter="url(#outerGlow)">
    <!-- S 主体 - 粗线条路径 -->
    <path
      d="M 44 23
         C 44 23, 48 23, 48 27
         C 48 31, 42 32, 38 33
         C 34 34, 28 35, 28 39
         C 28 43, 32 44, 36 44
         L 40 44
         C 40 44, 36 44, 36 40
         C 36 36, 42 35, 46 34
         C 50 33, 56 32, 56 28
         C 56 24, 52 23, 48 23
         L 44 23"
      fill="url(#sGradient)"
      stroke="url(#mainGradient)"
      stroke-width="1"
    />

    <!-- S 内部高光线条 -->
    <path
      d="M 45 25
         C 45 25, 46 25, 46 28
         C 46 31, 40 32, 36 33
         C 32 34, 30 35, 30 39
         C 30 42, 33 43, 36 43"
      fill="none"
      stroke="rgba(255,255,255,0.4)"
      stroke-width="1.5"
      stroke-linecap="round"
    />

    <!-- S 顶部端点装饰 -->
    <circle cx="44" cy="23" r="2.5" fill="url(#mainGradient)"/>
    <circle cx="44" cy="23" r="1.2" fill="rgba(255,255,255,0.6)"/>

    <!-- S 底部端点装饰 -->
    <circle cx="40" cy="44" r="2.5" fill="url(#mainGradient)"/>
    <circle cx="40" cy="44" r="1.2" fill="rgba(255,255,255,0.6)"/>
  </g>

  <!-- 代码符号 < 在左侧 -->
  <g opacity="0.9" filter="url(#strongGlow)">
    <polyline
      points="6,28 2,32 6,36"
      fill="none"
      stroke="url(#glowGradient)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- 代码符号 > 在右侧 -->
  <g opacity="0.9" filter="url(#strongGlow)">
    <polyline
      points="58,28 62,32 58,36"
      fill="none"
      stroke="url(#glowGradient)"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- 中心光点装饰 -->
  <circle cx="32" cy="18" r="2" fill="#00d4ff" opacity="0.8" filter="url(#innerGlow)"/>

  <!-- 底部装饰线 -->
  <line
    x1="22" y1="50"
    x2="42" y2="50"
    stroke="url(#glowGradient)"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.6"
  />

  <!-- 微光粒子效果 -->
  <circle cx="10" cy="16" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="54" cy="14" r="1.2" fill="#00d4ff" opacity="0.7"/>
  <circle cx="56" cy="48" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="8" cy="44" r="1" fill="#007aff" opacity="0.6"/>
</svg>
