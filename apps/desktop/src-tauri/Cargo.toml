[package]
name = "codingns-desktop"
version = "0.3.0"
description = "CodingNS desktop shell"
authors = ["CodingNS"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codingns_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.2", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-updater = "2.9.1"
