[package]
name = "codingns-desktop"
version = "1.0.1"
description = "CodingNS desktop shell"
authors = ["CodingNS"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "codingns_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.2", features = ["macos-private-api"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-updater = "2.9.1"
tauri-plugin-window-state = "2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSAppearance", "NSButton", "NSColor", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView", "NSWindow"] }
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
