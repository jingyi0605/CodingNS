name: desktop-build-and-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.7.1"

jobs:
  build-macos-universal:
    name: macos-universal-release
    runs-on: macos-latest
    environment: macOS-Package
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: 导入 Apple 签名证书
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_CERTIFICATE_P12_BASE64}" || -z "${APPLE_CERTIFICATE_PASSWORD}" || -z "${APPLE_KEYCHAIN_PASSWORD}" ]]; then
            echo "缺少 macOS 签名 secrets，请检查 APPLE_CERTIFICATE_P12_BASE64 / APPLE_CERTIFICATE_PASSWORD / APPLE_KEYCHAIN_PASSWORD" >&2
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/codingns-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codingns-signing.keychain-db"
          export CERT_PATH

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE_P12_BASE64"])
          )
          PY

          security create-keychain -p "${APPLE_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${APPLE_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -f pkcs12 \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          security default-keychain -d user -s "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "${APPLE_KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}"

      - name: 构建并发布 macOS 安装包
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_BUILD_TARGET: universal-apple-darwin
          CODINGNS_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-desktop.sh build macos
          ./scripts/build-desktop.sh release-macos

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-universal
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/macos-release/CodingNS.dmg
            apps/desktop/src-tauri/target/release/macos-release/CodingNS.app
            apps/desktop/src-tauri/target/release/macos-release/CodingNS.zip
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.tar.gz
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig

  build-windows:
    name: windows-installers
    runs-on: windows-latest
    environment: Updater
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install workspace dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build Windows installers
        env:
          CODINGNS_TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: ./scripts/build-desktop.sh windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.sig
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig

  publish-release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-macos-universal
      - build-windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"

          if ! gh release view "${tag_name}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release create "${tag_name}" \
              --repo "${GH_REPO}" \
              --title "${tag_name}" \
              --notes "Automated desktop release assets."
          fi

      - name: 生成桌面 updater latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["GH_REPO"]
          tag_name = os.environ["GITHUB_REF_NAME"]
          release_assets = Path("release-assets")

          mac_updates = sorted(release_assets.rglob("*.app.tar.gz"))
          mac_sigs = sorted(release_assets.rglob("*.app.tar.gz.sig"))
          win_updates = [
              path for path in sorted(release_assets.rglob("*.exe"))
              if not path.name.endswith(".sig")
          ]
          win_sigs = sorted(release_assets.rglob("*.exe.sig"))

          if not mac_updates or not mac_sigs or not win_updates or not win_sigs:
              raise SystemExit("缺少桌面 updater 产物，无法生成 latest.json")

          release_info = json.loads(
              subprocess.check_output(
                  [
                      "gh",
                      "release",
                      "view",
                      tag_name,
                      "--repo",
                      repo,
                      "--json",
                      "body,publishedAt",
                  ],
                  text=True,
              )
          )

          version = tag_name[1:] if tag_name.startswith("v") else tag_name

          def asset_url(path: Path) -> str:
              return f"https://github.com/{repo}/releases/download/{tag_name}/{path.name}"

          manifest = {
              "version": version,
              "notes": release_info.get("body") or "",
              "pub_date": release_info.get("publishedAt"),
              "platforms": {
                  "macos-universal": {
                      "signature": mac_sigs[0].read_text(encoding="utf-8").strip(),
                      "url": asset_url(mac_updates[0]),
                  },
                  "windows-x86_64": {
                      "signature": win_sigs[0].read_text(encoding="utf-8").strip(),
                      "url": asset_url(win_updates[0]),
                  },
              },
          }

          (release_assets / "latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: 上传 Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag_name="${GITHUB_REF_NAME}"

          mapfile -d "" files < <(
            find release-assets -type f \
              \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.sig" -o -name "*.tar.gz" -o -name "latest.json" \) \
              -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files were found." >&2
            exit 1
          fi

          gh release upload "${tag_name}" "${files[@]}" --repo "${GH_REPO}" --clobber
